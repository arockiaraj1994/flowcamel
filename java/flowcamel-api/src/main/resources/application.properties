%dev.quarkus.analytics.disabled=true
%dev.quarkus.test.continuous-testing=disabled
%dev.quarkus.console.enabled=false
%dev.quarkus.devservices.enabled=false

quarkus.http.port=8080
# Use DevCorsFilter instead — built-in CORS regex origins often reject Vite ports (5174, …)
quarkus.http.cors=false

quarkus.datasource.db-kind=sqlite
quarkus.datasource.jdbc.url=jdbc:sqlite:flowcamel.db
quarkus.datasource.jdbc.driver=org.sqlite.JDBC

flowcamel.db.init=true

# JBang first run downloads Camel BOM + jbang-core; 90s is often too short
flowcamel.test-run.timeout-seconds=300
